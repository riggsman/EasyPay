services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: easypay
      MYSQL_USER: easypay
      MYSQL_PASSWORD: easypay
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - easypay_mysql:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://easypay:easypay@db:3306/easypay
      SECRET_KEY: easypay-dev-secret-key-change-in-production-32chars
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - db
    command: >
      sh -c "python scripts/seed.py && uvicorn app.main:asgi_app --host 0.0.0.0 --port 8000"

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  easypay_mysql:
